services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      # override .env: inside the compose network, containers reach each other
      # by service name on their internal port, not the host-mapped port
      DATABASE_URL: postgres://mitto:mitto@postgres:5432/mitto
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  postgres:
    image: postgres:16-alpine
    # host port 4002 (not 5432) to avoid clashing with a locally-installed Postgres
    environment:
      POSTGRES_USER:     mitto
      POSTGRES_PASSWORD: mitto
      POSTGRES_DB:       mitto
    ports:
      - "4002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "4003:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
